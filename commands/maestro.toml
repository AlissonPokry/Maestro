description = "Route a task through the right Maestro skill bundle"
prompt = "Use Maestro from ./maestro/SKILL.md. First run `python ./maestro/scripts/maestro_config.py get --skill-file ./maestro/SKILL.md`. If status is missing, ask the user for the skill-bundle-folder path and run /maestro-set before routing. If the user typed `/maestro switch`, `/maestro fetch`, or `/maestro stats`, dispatch to the matching Maestro command workflow. Otherwise run `python ./maestro/scripts/maestro_route.py --query \"{{args}}\" --skill-file ./maestro/SKILL.md`; read only the returned skill_paths first, then execute the task. Always distinguish terminology: selected_bundles[].bundle are bundles, not skills; selected_bundles[].skill_paths[].path are the skills loaded/used."

